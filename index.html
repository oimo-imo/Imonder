<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Imonder — ブラウザ3Dモデラー</title>
  </head>
  <body>
    <div id="app">
      <header id="header">
        <div class="header-group">
          <button id="btn-add" class="hdr-btn hdr-btn-accent">+ 追加</button>
          <div id="add-menu" class="menu hidden">
            <button data-primitive="cube">立方体</button>
            <button data-primitive="plane">平面</button>
            <button data-primitive="cylinder">円柱</button>
            <button data-primitive="cone">円錐</button>
            <button data-primitive="sphere">球</button>
          </div>
          <button id="btn-mode" class="hdr-btn">オブジェクトモード</button>
        </div>
        <div class="header-group header-title">Imonder</div>
        <div class="header-group">
          <button id="btn-view-front" class="hdr-btn hdr-btn-icon" title="前面 (Numpad1)">前</button>
          <button id="btn-view-top" class="hdr-btn hdr-btn-icon" title="上面 (Numpad7)">上</button>
          <button id="btn-view-right" class="hdr-btn hdr-btn-icon" title="右面 (Numpad3)">右</button>
          <button id="btn-view-persp" class="hdr-btn hdr-btn-icon" title="パース (Numpad0)">視</button>
          <button id="btn-panel-toggle" class="hdr-btn hdr-btn-icon panel-toggle-only">☰</button>
        </div>
      </header>

      <div id="main">
        <div id="viewport-wrap">
          <div id="viewport"></div>

          <div id="tool-rail" class="rail">
            <!-- populated per-mode by App.ts -->
          </div>

          <div id="edit-select-rail" class="rail rail-top hidden">
            <!-- vertex/edge/face select-mode buttons, edit mode only -->
          </div>

          <div id="hint-bar">オブジェクトを追加してください</div>
        </div>

        <aside id="side-panel">
          <section class="panel-section">
            <h2>アウトライナー</h2>
            <div id="outliner"></div>
          </section>
          <section class="panel-section">
            <h2>モディファイアー</h2>
            <div id="modifier-empty" class="muted">オブジェクトを選択してください</div>
            <div id="modifier-stack"></div>
            <button id="btn-add-modifier" class="panel-btn hidden">+ モディファイアーを追加</button>
            <div id="add-modifier-menu" class="menu hidden">
              <button data-modifier="bevel">ベベル</button>
            </div>
          </section>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
